name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Overrides the repo's renv .Rprofile and sets the CRAN mirror; see the
      # comments in .github/ci-profile.R
      R_PROFILE_USER: ${{ github.workspace }}/.github/ci-profile.R
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("testthat", "data.table", "dplyr", "RColorBrewer", "scales", "shiny", "htmltools", "zoo"))'

      - name: Parse-check all R sources
        run: |
          Rscript -e '
            files <- c("app.R", "scripts/export_shinylive.R",
                       list.files("R", pattern = "\\.R$", full.names = TRUE))
            for (f in files) {
              tryCatch(parse(f), error = function(e) {
                stop("Parse error in ", f, ": ", conditionMessage(e))
              })
            }
            cat("All", length(files), "files parse OK\n")
          '

      - name: Run unit tests
        run: Rscript tests/testthat.R
