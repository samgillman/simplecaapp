name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Verify complete application dependencies
        run: |
          Rscript -e '
            desc <- read.dcf("DESCRIPTION")
            fields <- c("Imports", "Suggests")
            deps <- trimws(unlist(strsplit(paste(desc[1, fields], collapse = ","), ",")))
            deps <- sub("\\s*\\(.*$", "", deps)
            exempt <- c("shinylive")
            missing <- deps[!deps %in% exempt & !vapply(deps, requireNamespace, logical(1), quietly = TRUE)]
            if (length(missing)) stop("Missing dependencies: ", paste(missing, collapse = ", "))
          '

      - name: Parse-check all R sources
        run: |
          Rscript -e '
            files <- c(
              "app.R",
              list.files("R", pattern = "\\.R$", full.names = TRUE),
              list.files("scripts", pattern = "\\.R$", full.names = TRUE),
              "tests/smoke-app.R",
              "tests/browser-smoke.R"
            )
            for (f in files) {
              tryCatch(parse(f), error = function(e) {
                stop("Parse error in ", f, ": ", conditionMessage(e))
              })
            }
            cat("All", length(files), "files parse OK\n")
          '

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Initialize complete Shiny application
        run: Rscript tests/smoke-app.R

      - name: Install pinned Shinylive
        run: Rscript scripts/install_shinylive.R

      - name: Build Shinylive site
        run: Rscript scripts/export_shinylive.R

      - name: Run deployed Shinylive browser workflow smoke test
        env:
          SIMPLECA_BROWSER_MODE: shinylive
        run: Rscript tests/browser-smoke.R

      - name: Upload tested Shinylive build
        uses: actions/upload-artifact@v4
        with:
          name: shinylive-site
          path: _shinylive
          if-no-files-found: error
