name: Deploy Shinylive to Cloudflare Pages

# Builds the WebAssembly (Shinylive) version of the app and publishes it to
# Cloudflare Pages. Deployment credentials and domain configuration are
# maintainer-managed and are not part of the public user workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    if: github.repository == 'samgillman/simplecaapp'
    runs-on: ubuntu-latest
    env:
      # Overrides the repo's renv .Rprofile and sets the CRAN mirror; see the
      # comments in .github/ci-profile.R
      R_PROFILE_USER: ${{ github.workspace }}/.github/ci-profile.R
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install shinylive
        run: Rscript -e 'install.packages("shinylive")'

      - name: Build Shinylive site
        run: Rscript scripts/export_shinylive.R

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _shinylive --project-name=simpleca
